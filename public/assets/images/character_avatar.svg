<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="skinGrad" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#c68642"/>
      <stop offset="100%" stop-color="#9a5a25"/>
    </radialGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="jeansGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="sneakerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#f4511e"/>
    </linearGradient>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Sombra en el piso -->
    <ellipse cx="150" cy="402" rx="70" ry="10" fill="rgba(0,0,0,0.22)" />

    <!-- Mochila azul detrás (correas visibles) -->
    <path d="M 98 160 Q 88 190 92 230" stroke="#0288d1" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 202 160 Q 212 190 208 230" stroke="#0288d1" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Piernas con Jeans Azules -->
    <rect x="114" y="245" width="30" height="110" rx="10" fill="url(#jeansGrad)" />
    <rect x="156" y="245" width="30" height="110" rx="10" fill="url(#jeansGrad)" />
    <!-- Dobladillo de jeans -->
    <rect x="112" y="345" width="34" height="10" rx="4" fill="#64b5f6" />
    <rect x="154" y="345" width="34" height="10" rx="4" fill="#64b5f6" />

    <!-- Tobillos piel -->
    <rect x="120" y="352" width="18" height="14" fill="#9a5a25" />
    <rect x="162" y="352" width="18" height="14" fill="#9a5a25" />

    <!-- Tenis Naranjas con suela blanca -->
    <!-- Pie Izquierdo -->
    <ellipse cx="125" cy="382" rx="28" ry="15" fill="url(#sneakerGrad)" />
    <rect x="100" y="386" width="50" height="10" rx="5" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" />
    <path d="M 115 372 L 132 372" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 118 377 L 134 377" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pie Derecho -->
    <ellipse cx="175" cy="382" rx="28" ry="15" fill="url(#sneakerGrad)" />
    <rect x="150" y="386" width="50" height="10" rx="5" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" />
    <path d="M 165 372 L 182 372" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 168 377 L 184 377" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cuerpo: Sudadera Verde con Capucha (Green Hoodie) -->
    <path d="M 95 155 Q 150 140 205 155 L 198 258 Q 150 265 102 258 Z" fill="url(#hoodieGrad)" />
    <!-- Cierre / Zipper central -->
    <line x1="150" y1="160" x2="150" y2="258" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 2"/>
    <!-- Bolsillo de canguro -->
    <path d="M 115 220 L 185 220 L 175 254 L 125 254 Z" fill="#388e3c" stroke="#2e7d32" stroke-width="2"/>
    <!-- Parche blanco con letra "A" en el pecho izquierdo -->
    <circle cx="128" cy="188" r="14" fill="#ffffff" stroke="#ff9800" stroke-width="2"/>
    <text x="128" y="194" font-family="'Comic Sans MS', sans-serif" font-weight="900" font-size="16" text-anchor="middle" fill="#e65100">A</text>

    <!-- Mangas y Brazos (manos en los bolsillos del hoodie) -->
    <path d="M 100 158 Q 78 190 118 230" stroke="url(#hoodieGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M 200 158 Q 222 190 182 230" stroke="url(#hoodieGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>

    <!-- Cuello y capucha doblada -->
    <path d="M 118 145 Q 150 162 182 145" stroke="#388e3c" stroke-width="12" stroke-linecap="round" fill="none"/>
    <rect x="138" y="130" width="24" height="22" rx="6" fill="#9a5a25" />

    <!-- Cabeza -->
    <circle cx="150" cy="95" r="48" fill="url(#skinGrad)" />

    <!-- Orejas -->
    <circle cx="102" cy="96" r="11" fill="#9a5a25" />
    <circle cx="102" cy="96" r="6" fill="#c68642" />
    <circle cx="198" cy="96" r="11" fill="#9a5a25" />
    <circle cx="198" cy="96" r="6" fill="#c68642" />

    <!-- Cabello chino / rizado oscuro (Curly Dark Hair) -->
    <!-- Nubes de rizos -->
    <circle cx="110" cy="62" r="18" fill="#1f1813" />
    <circle cx="132" cy="50" r="20" fill="#1f1813" />
    <circle cx="155" cy="46" r="22" fill="#1f1813" />
    <circle cx="178" cy="52" r="20" fill="#1f1813" />
    <circle cx="195" cy="66" r="18" fill="#1f1813" />
    <circle cx="102" cy="80" r="15" fill="#1f1813" />
    <circle cx="198" cy="80" r="15" fill="#1f1813" />
    <circle cx="120" cy="74" r="14" fill="#2d221a" />
    <circle cx="145" cy="68" r="15" fill="#2d221a" />
    <circle cx="170" cy="72" r="14" fill="#2d221a" />

    <!-- Ojos grandes y amigables color café -->
    <ellipse cx="134" cy="92" rx="9" ry="12" fill="#ffffff" />
    <ellipse cx="166" cy="92" rx="9" ry="12" fill="#ffffff" />
    <ellipse cx="135" cy="92" rx="6" ry="8" fill="#3e2723" />
    <ellipse cx="167" cy="92" rx="6" ry="8" fill="#3e2723" />
    <circle cx="133" cy="89" r="2.5" fill="#ffffff" />
    <circle cx="165" cy="89" r="2.5" fill="#ffffff" />

    <!-- Cejas expresivas -->
    <path d="M 124 78 Q 134 74 142 78" stroke="#1f1813" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 158 78 Q 166 74 176 78" stroke="#1f1813" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Pequitas en las mejillas -->
    <circle cx="122" cy="102" r="1.5" fill="#794619" />
    <circle cx="126" cy="104" r="1.5" fill="#794619" />
    <circle cx="124" cy="107" r="1.5" fill="#794619" />
    <circle cx="174" cy="102" r="1.5" fill="#794619" />
    <circle cx="178" cy="104" r="1.5" fill="#794619" />
    <circle cx="176" cy="107" r="1.5" fill="#794619" />

    <!-- Naricita tierna -->
    <path d="M 148 98 Q 150 102 153 98" stroke="#794619" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Gran sonrisa alegre -->
    <path d="M 134 108 Q 150 130 166 108 Q 150 115 134 108 Z" fill="#b71c1c" />
    <!-- Dientes blancos arriba -->
    <path d="M 140 109 L 140 113 L 160 113 L 160 109 Z" fill="#ffffff" />
    <!-- Lengua rosita -->
    <path d="M 144 122 Q 150 116 156 122 Q 150 126 144 122 Z" fill="#ff4081" />

    <!-- Chapitas / Rubor -->
    <ellipse cx="118" cy="104" rx="8" ry="4" fill="#ff80ab" opacity="0.4" />
    <ellipse cx="182" cy="104" rx="8" ry="4" fill="#ff80ab" opacity="0.4" />
  </g>
</svg>
